[project]
name = "skillset"
version = "0.0.0.dev"  # Set by CI from release - do not edit manually
description = "Manage AI skills and permissions across different projects"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "ruamel.yaml>=0.18"]

[project.scripts]
skillset = "skillset.cli:main"

[tool.setuptools.packages.find]
include = ["skillset*"]

[tool.setuptools.package-data]
skillset = ["skill/**/*.md"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.8", "ty>=0.0.60"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "C901",   # mccabe complexity
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["skillset", "tests"]
