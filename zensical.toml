[project]

site_name = "skillset"
site_description = "Manage Claude Code skills, commands and agents across projects."
site_author = "Ville Vainio"
site_url = "https://vivainio.github.io/skillset/"
docs_dir = "docs"

copyright = """
Copyright &copy; 2026 Ville Vainio
"""

repo_url = "https://github.com/vivainio/skillset"
repo_name = "vivainio/skillset"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Adding skills" = "adding.md" },
  { "Finding and reading skills" = "searching.md" },
  { "Removing skills" = "removing.md" },
  { "skillset.yaml" = "config.md" },
  { "Updating" = "update.md" },
  { "Profiles" = "profiles.md" },
  { "How it works" = "how-it-works.md" },
  { "Comparison" = "comparison.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/layers"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vivainio/skillset"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
